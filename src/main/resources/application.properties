spring.application.name=imagetransformer

# --- Load .env (KEY=value) as a property source; optional so prod env vars still work ---
spring.config.import=optional:file:.env[.properties]

# --- Datasource (H2 in-memory for local dev) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/nimbusstore
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# --- JPA ---
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- H2 console at http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Debug logging (temporary, for diagnosing 401s) ---
logging.level.org.springframework.security=DEBUG

# --- App: storage ---
app.storage.local.root=${STORAGE_ROOT:${user.home}/.imagetransformer/uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secretKey=${JWT_SECRET_KEY:fallback-for-local-dev-only}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect