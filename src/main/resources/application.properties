spring.application.name=imagetransformer

# --- Load .env (KEY=value) as a property source; optional so prod env vars still work ---
spring.config.import=optional:file:.env[.properties]

# --- Datasource (H2 in-memory for local dev) ---
spring.datasource.url=jdbc:h2:mem:imagetransformer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway disabled (no H2 migrations yet) ---
spring.flyway.enabled=false

# --- H2 console at http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Debug logging (temporary, for diagnosing 401s) ---
logging.level.org.springframework.security=DEBUG

# --- App: storage ---
app.storage.local.root=${STORAGE_ROOT:${user.home}/.imagetransformer/uploads}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secretKey=${JWT_SECRET_KEY:fallback-for-local-dev-only}